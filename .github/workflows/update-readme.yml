name: Update README

# The CD half: whenever a solve lands on master, regenerate the stats block
# and commit it back so the README never goes stale by hand.

on:
  push:
    branches: [master]
    paths:
      - "problems/**"
      - "lists/**"
      - "scripts/update_readme.py"
      - "scripts/problem_lists.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    # Never run on forks -- they can't push back to this repo anyway.
    if: github.repository == 'omcal/daily-leetcode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README
        run: python scripts/update_readme.py

      - name: Commit if changed
        run: |
          # lists/ only exists once a curated list is added, and `git add` on a
          # pathspec that matches nothing is a fatal error -- so build the list
          # of paths from what's actually there.
          paths=(README.md)
          [ -d lists ] && paths+=(lists)

          if git diff --quiet -- "${paths[@]}"; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "chore: refresh README stats [skip ci]"
          git push
