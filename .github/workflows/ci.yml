name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q

  readme-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README
        run: python scripts/update_readme.py

      # On master a follow-up workflow commits the regenerated README, so this
      # job is here to catch drift early on pull requests -- hence warn-only.
      - name: Report drift
        run: |
          if git diff --quiet -- README.md lists/; then
            echo "README is in sync with problems/."
          else
            echo "::warning::README is out of date. Run: python scripts/update_readme.py"
            git --no-pager diff -- README.md lists/
          fi
